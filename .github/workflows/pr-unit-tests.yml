name: C++ Conan CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cpp-conan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conan-create:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CONAN_REMOTE_URL: ${{ secrets.CONAN_REMOTE_URL }}
      CONAN_LOGIN_USERNAME: ${{ secrets.CONAN_LOGIN_USERNAME }}
      CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-14 \
            g++-14 \
            cmake \
            ninja-build \
            graphviz \
            crudini

      - name: Set gcc-14 as default
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 10
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 10

      - name: Setup Conan client
        uses: conan-io/setup-conan@v1
        with:
          version: "2.*"
          use_venv: true

      - name: Set Conan profile
        run: |
          conan profile detect --force
          crudini --set "$HOME/.conan2/profiles/default" settings compiler.cppstd 20
          crudini --set "$HOME/.conan2/profiles/default" settings compiler.version 14
          conan profile show --profile:host=default --profile:build=default

      - name: Compute Conan cache key
        id: conan-cache-key
        run: |
          # Hash the recipe together with the effective profile so a toolchain or
          # settings change (compiler version, cppstd, libcxx, runner image) gets its own key.
          echo "key=$(cat conanfile.py "$HOME/.conan2/profiles/default" | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"

      # Only ~/.conan2/p (package storage + its cache.sqlite3 index) is cached.
      # Caching the whole ~/.conan2 would also persist profiles, remotes.json and
      # .conan.db, which stores the private remote login token.
      - name: Restore Conan cache
        id: conan-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan2-${{ steps.conan-cache-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-conan2-

      - name: Login private Conan remote (optional)
        if: env.CONAN_REMOTE_URL != '' && env.CONAN_LOGIN_USERNAME != '' && env.CONAN_PASSWORD != ''
        run: |
          conan remote add org "$CONAN_REMOTE_URL" --force
          conan remote login org "$CONAN_LOGIN_USERNAME" --password "$CONAN_PASSWORD"
          conan remote list

      - name: Install dependencies
        run: conan install . --build=missing

      - name: Prune Conan cache before save
        if: steps.conan-cache.outputs.cache-hit != 'true'
        run: |
          # Drop packages unused for 4 weeks (stale leftovers from restore-key fallbacks),
          # then remove source/build/download/temp folders so only built binaries persist.
          conan remove "*" --lru=4w --confirm
          conan cache clean "*" --source --build --download --temp

      # Saved right after dependencies are built, so a failing build/test of this
      # package does not throw away the expensive dependency build.
      - name: Save Conan cache
        if: steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.conan2/p
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}

      - name: Build and test package
        run: conan create . --build=missing
